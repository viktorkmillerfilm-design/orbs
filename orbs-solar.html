  const ORDER = ['house', 'techno', 'lofi', 'hiphop', 'trap', 'dnb', 'psytrance', 'ambient', 'dub', 'afrobeat', 'synthwave', 'meditation'];

  function resolve(genre) {
    if (genre && typeof genre === 'object' && genre.elements && genre.bpm) return genre;
    const id = ALIASES[normId(genre)];
    if (!id || !PRESETS[id]) {
      const err = new Error('unknown genre: ' + genre);
      err.code = 'unknown-genre';
      throw err;
    }
    return PRESETS[id];
  }

  function list() {
    return ORDER.map(id => {
      const p = PRESETS[id];
      return {
        id: p.id,
        name: p.name,
        bpm: p.bpm,
        swing: p.swing,
        key: p.key.name + ' ' + p.key.mode,
        root: p.key.root,
        scale: p.key.mode
      };
    });
  }

  function get(name) { return deepCopy(resolve(name)); }

  function chordAt(barIndex, genre) {
    const g = resolve(genre);
    const n = g.prog.length;
    const i = ((barIndex % n) + n) % n;
    const C = g.prog[i];
    return { r: C.r, t: C.t.slice(), name: C.name, notes: chordNotes(C), bar: barIndex, i };
  }

  function voicingNotes(C, voicing) {
    if (voicing === 'fifth' || voicing === '5') return [C.r, C.r + 7, C.r + 12];
    if (voicing === 'shell') return [C.r, C.r + (C.t[C.t.length - 1] || 10), C.r + 12];
    if (voicing === 'spread') return [C.r - 12].concat(chordNotes(C));
    if (voicing === 'pad') return padNotes(C);
    if (Array.isArray(voicing)) return voicing.map(x => C.r + x);
    return chordNotes(C);
  }

  function pitchFor(el, at, g, C) {
    const hit = el.hit || {};
    const key = g.key;
    if (hit.kind === 'drum' && hit.n != null) return hit.n;
    if (hit.line) {
      const row = hit.line.find(r => Math.abs((Array.isArray(r) ? r[0] : r.at) - at) < 1e-6);
      if (row) {
        const deg = Array.isArray(row) ? row[1] : (row.deg || row.degree);
        const oct = (Array.isArray(row) ? hit.octave : (row.oct != null ? row.oct : hit.octave));
        return parseDegree(deg, key, oct == null ? 4 : oct);
      }
    }
    if (hit.role === 'root' || hit.kind === 'drone' && hit.role !== 'pad') {
      const oct = hit.octave == null ? 1 : hit.octave;
      return 12 * (oct + 1) + pcOf(C.r);
    }
    if (hit.role === 'fifth') {
      const oct = hit.octave == null ? 3 : hit.octave;
      return 12 * (oct + 1) + pcOf(C.r + 7);
    }
    if (hit.role === 'pattern' && hit.degrees && hit.degrees.length) {
      const i = Math.round(at * 4);
      const deg = hit.degrees[((i % hit.degrees.length) + hit.degrees.length) % hit.degrees.length];
      return parseDegree(deg, key, hit.octave == null ? 3 : hit.octave);
    }
    if (hit.role === 'chord' || hit.kind === 'arp') {
      const pool = chordNotes(C).map(n => {
        if (hit.octave == null) return n;
        return 12 * (hit.octave + 1) + pcOf(n);

    if (typeof hit.degree !== 'undefined') return parseDegree(hit.degree, key, hit.octave);

  function nearHit(hits, p, cycle, eps) {
    const pos = ((p % cycle) + cycle) % cycle;
    for (let i = 0; i < hits.length; i++) {
      const h = +hits[i];
      const d = Math.min(Math.abs(pos - h), Math.abs(pos + cycle - h), Math.abs(pos - cycle - h));
      if (d <= (eps == null ? 1e-6 : eps)) return { at: h, i };

    return null;

    if (step && typeof step === 'object') {
      if (step.step != null && step.bar != null) return step.bar * 16 + step.step;
      if (step.beat != null) return Math.round(step.beat * 4);

    return +step || 0;

    const g = resolve(genre);
    const id = ELEMENTS.indexOf(baseOf(element)) >= 0 ? baseOf(element) : baseOf(element);

    if (!elp) return null;
    const stepN = toStep(step);
    const p = stepN / 4;
    const bar = Math.floor(p / 4 + 1e-9);
    const C = chordAt(bar, g);
    const cycle = elp.cycle || 4;
    const pos = ((p % cycle) + cycle) % cycle;
    const hit = elp.hit || {};

    return {
      variant: elp.variant,
      voice: deepCopy(elp.voice || voiceOf(id, elp.variant)),
      hit: deepCopy(elp.hit || {}),
      vol: elp.vol,
      verb: elp.verb,
      echo: elp.echo,
      cut: elp.cut

  function layoutPatch(elp) {
    return {
      lap: elp.lap,
      a: elp.a,
      angles: elp.angles.slice(),
      hits: elp.hits.slice(),
      orbit: elp.orbit,
      distance: elp.distance,
      cycle: elp.cycle

    const mode = (opts && opts.mode) === 'relayout' ? 'relayout' : 'sounds';
    const st = state || {};
    const planets = planetsOf(st);
    const elements = {};

    /* clones inherit the base element's sound; rec samples are omitted */
    Object.keys(planets).forEach(pid => {
      const p = planets[pid];
      if (isRec(p) || isRec(pid)) return;
      const base = baseOf(p.id || pid);
      if (ELEMENTS.indexOf(base) < 0) return;
      if (pid !== base && !elements[pid]) elements[pid] = soundPatch(g.elements[base], base);
    });

    const diff = {
      genre: g.id,
      name: g.name,
      mode,
      bpm: g.bpm,
      swing: g.swing,
      key: deepCopy(g.key),
      scale: g.key.mode,
      pcs: g.pcs.slice(),
      prog: deepCopy(g.prog),
      fx: deepCopy(g.fx),

    if (mode === 'sounds') {
      diff.kept = { positions: true, laps: true, angles: true };

    }

    const orbits = (g.orbits || [1, 2, 4, 16]).map((lap, i) => ({ index: i, lap: snapLap(lap) }));
    const layout = { orbits, planets: {} };

    const groups = {};
    Object.keys(planets).forEach(pid => {
      const p = planets[pid];
      if (isRec(p) || isRec(pid)) return;
      const base = baseOf(p.id || pid);
      if (ELEMENTS.indexOf(base) < 0) return;
      (groups[base] = groups[base] || []).push(pid);

    ELEMENTS.forEach(id => {

      const ids = groups[id] && groups[id].length ? groups[id] : [id];
      const angles = elp.angles;
      const hits = elp.hits;
      ids.forEach((pid, i) => {
        const a = angles[i % angles.length];
        const hit = hits[i % hits.length];

          hit,
          angles: angles.slice(),
          hits: hits.slice()
        });

          patch.hit = hit;

      }).filter(Boolean);
    } else {
      const beat = aToHit(p.a || 0) * lap;
      hits = [{
        beat: beat,
        vel: p.velocity != null ? p.velocity : p.vel,
        note: p.note != null ? p.note : p.n,
        dur: p.length != null ? p.length : p.dur

    }
    const fallbackNote = (p.note != null ? p.note : (p.n != null ? p.n : (p.hit && (p.hit.n != null ? p.hit.n : p.hit.note))));
    const fallbackVel = (p.velocity != null ? p.velocity : (p.vel != null ? p.vel : (p.hit && p.hit.velocity)));
    const fallbackDur = (p.length != null ? p.length : (p.dur != null ? p.dur : (p.hit && p.hit.length)));
    return { lap, period, hits, fallbackNote, fallbackVel, fallbackDur, vol: p.vol };

  function loopLengthBeats(planets, opts) {
    opts = opts || {};
    if (isNum(opts.loopBeats) && opts.loopBeats > 0) return +opts.loopBeats;
    if (isNum(opts.bars) && opts.bars > 0) return +opts.bars * 4;
    const ppq = opts.ppq || 480;
    const ticks = planets.map(p => {
      const pat = planetPattern(p);
      return Math.max(1, Math.round(pat.period * ppq));
    });

    const t = ticks.reduce((a, b) => lcm(a, b), 1);

  /* ---------------- SMF writer / parser ---------------- */

  function vlqBytes(v) {
    v = Math.max(0, v | 0);
    const bytes = [v & 0x7f];
    v >>= 7;
    while (v > 0) { bytes.unshift((v & 0x7f) | 0x80); v >>= 7; }
    return bytes;
  }

  function pushVLQ(out, v) {
    const b = vlqBytes(v);
    for (let i = 0; i < b.length; i++) out.push(b[i]);
  }

  function writeChunk(id, payload) {
    const arr = new Uint8Array(8 + payload.length);
    arr[0] = id.charCodeAt(0); arr[1] = id.charCodeAt(1);
    arr[2] = id.charCodeAt(2); arr[3] = id.charCodeAt(3);
    const len = payload.length;
    arr[4] = (len >>> 24) & 0xff;
    arr[5] = (len >>> 16) & 0xff;
    arr[6] = (len >>> 8) & 0xff;
    arr[7] = len & 0xff;
    arr.set(payload, 8);
    return arr;
  }

  function ev(tick, bytes) { return { tick: tick, bytes: bytes }; }

  function trackBytes(events, endTick) {
    events = events.slice().sort((a, b) => {
      if (a.tick !== b.tick) return a.tick - b.tick;
      const ao = a.bytes[0] & 0xf0, bo = b.bytes[0] & 0xf0;
      // note-offs (80 or 90 vel0) before note-ons at the same tick
      const aOff = ao === 0x80 || (ao === 0x90 && a.bytes[2] === 0);
      const bOff = bo === 0x80 || (bo === 0x90 && b.bytes[2] === 0);
      if (aOff !== bOff) return aOff ? -1 : 1;
      return 0;
    });
    const out = [];
    let last = 0;
    for (let i = 0; i < events.length; i++) {
      const e = events[i];
      const t = Math.max(last, e.tick | 0);
      pushVLQ(out, t - last);
      last = t;
      for (let j = 0; j < e.bytes.length; j++) out.push(e.bytes[j] & 0xff);
    }
    const end = Math.max(last, endTick | 0);
    pushVLQ(out, end - last);
    out.push(0xff, 0x2f, 0x00);
    return new Uint8Array(out);
  }

  function metaName(name) {
    const s = String(name || '');
    const bytes = [];
    for (let i = 0; i < s.length; i++) bytes.push(s.charCodeAt(i) & 0x7f);
    return ev(0, [0xff, 0x03, bytes.length].concat(bytes));
  }

  function metaTempo(bpm) {
    const us = Math.max(1, Math.round(60000000 / (isNum(bpm) && bpm > 0 ? bpm : 120)));

  }

  function metaTimeSig(num, den) {

    den = den || 4;

    return ev(0, [0xff, 0x58, 0x04, num, dd, 24, 8]);

  function planetEvents(p, opts, ppq, loopBeats) {
    if (p && (p.muted || p.mute)) return { events: [], ch: resolveChannel(p), name: (p.name || p.id || 'track') };
    const pat = planetPattern(p);
    const ch = (resolveChannel(p) - 1) & 15;
    const events = [];
    const fallback = defaultNote(p);
    const hitDur = isNum(pat.fallbackDur) && pat.fallbackDur > 0 ? pat.fallbackDur : 0.25;
    const period = pat.period > 0 ? pat.period : loopBeats;
    for (let cycle = 0; cycle * period < loopBeats - 1e-9; cycle++) {
      const base = cycle * period;
      for (let i = 0; i < pat.hits.length; i++) {
        const h = pat.hits[i];
        const beat = base + h.beat;
        if (beat < -1e-9 || beat >= loopBeats - 1e-12) continue;
        const tick = Math.round(beat * ppq);
        const notes = asNotes(h.note != null ? h.note : (pat.fallbackNote != null ? pat.fallbackNote : fallback), fallback);
        const vel = vel7(h.vel != null ? h.vel : pat.fallbackVel, pat.vol);
        let durBeats = isNum(h.dur) && h.dur > 0 ? h.dur : hitDur;

        const loopTick = Math.round(loopBeats * ppq);
        if (off > loopTick) off = loopTick;
        if (off <= tick) off = tick + 1;
        for (let n = 0; n < notes.length; n++) {

  function planetsIndex(opts, p) { return 0; }

  function toMidi(planets, opts) {
    opts = opts || {};
    const list = !planets ? [] : (Array.isArray(planets) ? planets : Object.keys(planets).map(k => {
      const p = planets[k];
      return (p && typeof p === 'object') ? Object.assign({ id: p.id || k }, p) : null;
    }).filter(Boolean));
    const bpm = isNum(opts.bpm) && opts.bpm > 0 ? +opts.bpm : 120;
    const ppq = isNum(opts.ppq) && opts.ppq > 0 ? (opts.ppq | 0) : 480;
    const type = opts.type === 0 || opts.type === '0' ? 0 : 1;
    const loopBeats = loopLengthBeats(list, Object.assign({}, opts, { ppq: ppq }));
    const loopTick = Math.round(loopBeats * ppq);
    const local = Object.assign({}, opts, { bpm: bpm });

    const parts = list.map(p => planetEvents(p, local, ppq, loopBeats));
    const tracks = [];

    if (type === 0) {
      const evs = [metaName(opts.names && opts.names.conductor ? opts.names.conductor : 'orbs'), metaTempo(bpm), metaTimeSig(4, 4)];
      parts.forEach(p => { for (let i = 0; i < p.events.length; i++) evs.push(p.events[i]); });
      tracks.push(trackBytes(evs, loopTick));
    } else {
      const condName = (opts.names && (opts.names.conductor || opts.names._conductor)) || 'orbs';
      tracks.push(trackBytes([metaName(condName), metaTempo(bpm), metaTimeSig(4, 4)], loopTick));
      parts.forEach(p => {
        const evs = [metaName(p.name)];
        for (let i = 0; i < p.events.length; i++) evs.push(p.events[i]);

    }

    const header = new Uint8Array(14);
    header.set([0x4d, 0x54, 0x68, 0x64, 0, 0, 0, 6]);
    header[8] = 0; header[9] = type;
    header[10] = (tracks.length >> 8) & 0xff; header[11] = tracks.length & 0xff;
    header[12] = (ppq >> 8) & 0xff; header[13] = ppq & 0xff;
    const chunks = [header];
    let total = 14;
    for (let i = 0; i < tracks.length; i++) {
      const c = writeChunk('MTrk', tracks[i]);
      chunks.push(c); total += c.length;
    }
    const out = new Uint8Array(total);
    let o = 0;
    for (let i = 0; i < chunks.length; i++) { out.set(chunks[i], o); o += chunks[i].length; }
    return out;
  }

  function downloadMidi(data, filename) {
    const bytes = data instanceof Uint8Array ? data : new Uint8Array(data);
    if (typeof Blob === 'undefined') return bytes.buffer;
    const blob = new Blob([bytes], { type: 'audio/midi' });
    if (typeof document !== 'undefined') {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename || 'orbs.mid';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        try { URL.revokeObjectURL(a.href); a.remove(); } catch (e) {}

  function parseVLQ(buf, p) {
    let v = 0, i = 0, b;
    do {

      b = buf[p.i++];
      v = (v << 7) | (b & 0x7f);
      if (++i > 4) throw new Error('vlq too long');
    } while (b & 0x80);
    return v;
  }

  function parseMidi(data) {
    const buf = data instanceof Uint8Array ? data : new Uint8Array(data);
    const p = { i: 0 };
    const str = n => {
      let s = '';
      for (let i = 0; i < n; i++) s += String.fromCharCode(buf[p.i++]);
      return s;
    };
    const u32 = () => (buf[p.i++] << 24 | buf[p.i++] << 16 | buf[p.i++] << 8 | buf[p.i++]) >>> 0;
    const u16 = () => (buf[p.i++] << 8 | buf[p.i++]) & 0xffff;
    if (str(4) !== 'MThd') throw new Error('no MThd');
    const hlen = u32();
    if (hlen < 6) throw new Error('bad header len');
    const format = u16(), ntrk = u16(), ppq = u16();
    p.i += hlen - 6;
    const tracks = [];
    for (let t = 0; t < ntrk; t++) {
      if (str(4) !== 'MTrk') throw new Error('no MTrk at track ' + t);
      const len = u32(), end = p.i + len;
      let tick = 0, running = 0, name = '', tempo = null, usq = null;
      let noteOn = 0, noteOff = 0, eot = false;
      const events = [], open = new Map();
      while (p.i < end) {
        tick += parseVLQ(buf, p);
        let st = buf[p.i];
        if (st >= 0x80) { p.i++; } else { st = running; }
        if (st === 0xff) {
          const type = buf[p.i++], l = parseVLQ(buf, p);
          const start = p.i; p.i += l;
          const dataBytes = buf.slice(start, start + l);
          if (type === 3) {
            name = String.fromCharCode.apply(null, dataBytes);
          } else if (type === 0x51 && l === 3) {
            usq = (dataBytes[0] << 16) | (dataBytes[1] << 8) | dataBytes[2];
            tempo = 60000000 / usq;
          } else if (type === 0x2f) {
            eot = true;
          }
          events.push({ tick: tick, type: 'meta', meta: type, data: dataBytes });
        } else if (st === 0xf0 || st === 0xf7) {
          const l = parseVLQ(buf, p); p.i += l;
        } else {
          running = st;
          const hi = st & 0xf0, ch = (st & 15) + 1;
          const d1 = buf[p.i++];
          const d2 = (hi === 0xc0 || hi === 0xd0) ? 0 : buf[p.i++];
          events.push({ tick: tick, type: hi, ch: ch, d1: d1, d2: d2 });
          const key = ch + ':' + d1;
          if (hi === 0x90 && d2 > 0) { noteOn++; open.set(key, (open.get(key) || 0) + 1); }
          else if (hi === 0x80 || (hi === 0x90 && d2 === 0)) {
            noteOff++;
            open.set(key, Math.max(0, (open.get(key) || 0) - 1));
          }
        }
      }
      const dangling = Array.from(open.values()).reduce((a, b) => a + b, 0);
      tracks.push({
        name: name, endTick: tick, noteOn: noteOn, noteOff: noteOff,
        tempo: tempo, tempoUs: usq, eot: eot, dangling: dangling, events: events
      });
    }
    return { format: format, ntrk: ntrk, ppq: ppq, tracks: tracks };
  }

  /* ---------------- WAV encode / offline render ---------------- */

  function channelData(buf, c) {

    if (buf.channels && buf.channels[c]) return buf.channels[c];
    return new Float32Array(buf.length || 0);

  function encodeWav(audioBuffer, opts) {

    const ch = audioBuffer.numberOfChannels || audioBuffer.channels || 1;

    const n = audioBuffer.length != null ? audioBuffer.length : channelData(audioBuffer, 0).length;
    const depth = opts.bitDepth === 24 ? 24 : (opts.bitDepth === '32f' || opts.bitDepth === 32 ? 32 : 16);
    const isFloat = depth === 32;
    const bytesPer = isFloat ? 4 : (depth === 24 ? 3 : 2);
    const dataSize = n * nCh * bytesPer;
    const fmtSize = 16;
    const ab = new ArrayBuffer(44 + dataSize + (dataSize & 1));
    const view = new DataView(ab);
    const wu = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
    wu(0, 'RIFF');
    view.setUint32(4, 36 + dataSize + (dataSize & 1), true);
    wu(8, 'WAVE');
    wu(12, 'fmt ');
    view.setUint32(16, fmtSize, true);
    view.setUint16(20, isFloat ? 3 : 1, true);
    view.setUint16(22, nCh, true);
    view.setUint32(24, sr, true);
    view.setUint32(28, sr * nCh * bytesPer, true);
    view.setUint16(32, nCh * bytesPer, true);
    view.setUint16(34, isFloat ? 32 : depth, true);
    wu(36, 'data');
    view.setUint32(40, dataSize, true);
    const planes = [];
    for (let c = 0; c < nCh; c++) planes.push(channelData(audioBuffer, c));
    let o = 44;
    for (let i = 0; i < n; i++) {
      for (let c = 0; c < nCh; c++) {
        let s = planes[c][i] || 0;
        if (isFloat) {
          view.setFloat32(o, s, true); o += 4;
        } else if (depth === 24) {
          s = clamp(s, -1, 1);
          let v = Math.round(s * 0x7fffff);
          if (v > 0x7fffff) v = 0x7fffff;
          if (v < -0x800000) v = -0x800000;
          if (v < 0) v += 0x1000000;
          view.setUint8(o, v & 0xff);
          view.setUint8(o + 1, (v >> 8) & 0xff);
          view.setUint8(o + 2, (v >> 16) & 0xff);
          o += 3;
        } else {
          s = clamp(s, -1, 1);
          let v = Math.round(s * 0x7fff);

          if (v < -32768) v = -32768;
          view.setInt16(o, v, true); o += 2;

    if (dataSize & 1) view.setUint8(44 + dataSize, 0);

    const ch = isNum(opts.channels) && opts.channels > 0 ? (opts.channels | 0) : 2;

  async function renderStems(planetIds, render, opts) {

      duration: opts.duration, sampleRate: opts.sampleRate,
      channels: opts.channels, bitDepth: opts.bitDepth

  /* ---------------- field chop ---------------- */

  function monoOf(buf) {

    const out = new Float32Array(n);

      for (let i = 0; i < n; i++) out[i] += d[i] / ch;

    return out;
  }

  function median(a) {
    if (!a.length) return 0;
    const b = a.slice().sort((x, y) => x - y);
    const m = b.length >> 1;
    return b.length % 2 ? b[m] : 0.5 * (b[m - 1] + b[m]);

  function chop(audioBuffer, opts) {
    opts = opts || {};
    if (!audioBuffer || !audioBuffer.sampleRate) return [];
    const sr = audioBuffer.sampleRate;
    const x = monoOf(audioBuffer);
    const n = x.length;
    const maxHits = opts.maxHits == null ? 16 : Math.max(0, opts.maxHits | 0);
    const minGapMs = opts.minGapMs == null ? 60 : Math.max(0, +opts.minGapMs);
    const minGap = Math.round(minGapMs * 0.001 * sr);
    const sensitivity = opts.sensitivity == null ? 0.55 : clamp(+opts.sensitivity, 0, 1);

    const hop = Math.max(32, Math.round(sr * 0.0025)); // ~2.5 ms
    const win = hop * 4;
    const nFrames = Math.max(1, 1 + Math.floor((n - win) / hop));
    const env = new Float32Array(nFrames);
    const henv = new Float32Array(nFrames);
    const peak = new Float32Array(nFrames);
    for (let f = 0; f < nFrames; f++) {
      const a = f * hop, b = Math.min(n, a + win);
      let e = 0, h = 0, pk = 0;
      let prev = a > 0 ? x[a - 1] : 0;
      for (let i = a; i < b; i++) {
        const s = x[i], as = s < 0 ? -s : s;
        e += s * s;
        const d = s - prev; h += d * d;
        if (as > pk) pk = as;
        prev = s;

      const den = Math.max(1, b - a);
      env[f] = Math.sqrt(e / den);
      henv[f] = Math.sqrt(h / den);
      peak[f] = pk;
    }
    const flux = new Float32Array(nFrames);
    let maxFlux = 0;
    for (let f = 0; f < nFrames; f++) {
      const de = env[f] - (f ? env[f - 1] : env[0]);
      const dh = henv[f] - (f ? henv[f - 1] : henv[0]);
      const v = Math.max(0, de) + 1.4 * Math.max(0, dh);
      flux[f] = v;
      if (v > maxFlux) maxFlux = v;

    if (maxFlux <= 1e-12) return [];

    const hw = Math.max(3, Math.round((0.12 * sr) / hop));
    const k = 1.15 + 2.4 * (1 - sensitivity);
    const thresh = new Float32Array(nFrames);
    const tmp = [];
    for (let f = 0; f < nFrames; f++) {

      const a = Math.max(0, f - hw), b = Math.min(nFrames, f + hw + 1);

      const med = median(tmp);

      for (let i = 0; i < tmp.length; i++) mad += Math.abs(tmp[i] - med);
      mad = (mad / Math.max(1, tmp.length)) * 1.4826;

      const abs = t <= 1 ? t * maxFlux : t;

    }

    const raw = [];
    for (let f = 1; f < nFrames - 1; f++) {
      if (flux[f] < thresh[f]) continue;
      if (flux[f] < flux[f - 1] || flux[f] <= flux[f + 1]) continue;
      // the triggering frame often starts before the transient; search the
      // whole frame (and one hop after) for the true abs peak.
      const a = Math.max(0, f * hop), b = Math.min(n, f * hop + win + hop);
      let bestI = a, bestA = 0;
      for (let i = a; i < b; i++) {
        const as = x[i] < 0 ? -x[i] : x[i];
        if (as > bestA) { bestA = as; bestI = i; }
      }
      raw.push({ i: bestI, start: bestI / sr, peak: bestA, flux: flux[f] });
    }

    raw.sort((a, b) => a.i - b.i);
    const spaced = [];
    for (let i = 0; i < raw.length; i++) {
      const c = raw[i];
      const prev = spaced[spaced.length - 1];
      if (prev && (c.i - prev.i) < minGap) {
        if (c.peak > prev.peak) spaced[spaced.length - 1] = c;
      } else {
        spaced.push(c);
      }
    }

    let kept = spaced;
    if (kept.length > maxHits) {
      kept = kept.slice().sort((a, b) => b.peak - a.peak || b.flux - a.flux).slice(0, maxHits);
      kept.sort((a, b) => a.i - b.i);
    }

    const silence = Math.max(0.0005, (opts.silence != null ? +opts.silence : 0.08));
    const hits = kept.map((c, idx) => {
      const nextStart = idx + 1 < kept.length ? kept[idx + 1].i : n;
      // find silence after the peak, or stop at the next onset
      let end = nextStart;
      const floor = Math.max(1e-4, c.peak * silence);
      const hold = Math.round(0.012 * sr); // 12 ms of quiet
      let quiet = 0;
      const from = Math.min(n, c.i + Math.round(0.004 * sr));
      for (let i = from; i < nextStart; i++) {
        const as = x[i] < 0 ? -x[i] : x[i];
        if (as <= floor) {
          quiet++;
          if (quiet >= hold) { end = i - hold + 1; break; }

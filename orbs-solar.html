/* orbs fx batch 1: utility, clip clock, filter
   plain umd, no deps. exposes OrbsFX (and module.exports).
   smoothing: setTargetAtTime(v, now, 0.02)
*/
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root && typeof root === 'object') root.OrbsFX = api;
}(typeof self !== 'undefined' ? self : this, function () {

  const TICK_MS = 25;
  const HORIZON = 0.1;
  const LAP_STEPS = [0.25, 0.5, 1, 2, 3, 4, 8];
  const CUT_MIN = 20;
  const CUT_MAX = 20000;
  const Q_MIN = 0.5;
  const Q_MAX = 12;
  const BPM_MIN = 40;
  const BPM_MAX = 220;
  const GAIN_MIN = -60;
  const GAIN_MAX = 6;
  const DEAD = 0.04;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dbToGain = db => {
    if (!isFinite(db) || db <= GAIN_MIN) return 0;
    return Math.pow(10, db / 20);
  };

    if (!isFinite(g) || g <= 0) return -Infinity;
    return 20 * Math.log10(g);
  };
  const clampGainDb = v => {
    if (v === '-inf' || v === -Infinity || (typeof v === 'number' && v <= GAIN_MIN)) return -Infinity;
    const n = +v;
    if (!isFinite(n)) return 0;
    return clamp(n, GAIN_MIN, GAIN_MAX);
  };

    const x = +v;
    let best = LAP_STEPS[0], bd = Infinity;
    for (let i = 0; i < LAP_STEPS.length; i++) {
      const d = Math.abs(LAP_STEPS[i] - x);
      if (d < bd) { bd = d; best = LAP_STEPS[i]; }
    }
    return best;

    smooth(chain.utilGain.gain, signed, ctx);
    smooth(chain.panner.pan, state.pan, ctx);
    smooth(chain.stereoGain.gain, state.mono ? 0 : 1, ctx);
    smooth(chain.monoGain.gain, state.mono ? 1 : 0, ctx);

  function applyFilter(chain, state, ctx) {

    }

        ctx2d.lineTo(x + s * b, y - c * b);

      ctx2d.fillStyle = 'rgba(255,255,255,' + Math.max(0.45, alpha) + ')';
      ctx2d.font = '9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
      ctx2d.textAlign = 'center';
      ctx2d.textBaseline = 'bottom';
      ctx2d.fillText('ø', x, y - r - 7);

      ctx2d.font = '10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
      ctx2d.textAlign = 'left';
      ctx2d.textBaseline = 'middle';

    if (v === 0.5) return '1/2 bar';

    create,
    createChain,
    clamp, dbToGain, gainToDb, clampGainDb, snapLap, snapOffset,

  'use strict';

  const SMOOTH = 0.02;
  const EQ_MIN = -15, EQ_MAX = 15;
  const EQ_LO_HZ = 200, EQ_MID_HZ = 1000, EQ_HI_HZ = 5000, EQ_MID_Q = 0.9;
  const DRIVE_MIN = 0, DRIVE_MAX = 24;
  const OUT_MIN = -12, OUT_MAX = 6;
  const FB_MIN = 0, FB_MAX = 0.9;
  const SEND_MIN = 0, SEND_MAX = 1;
  const DELAY_MAX_S = 2;
  const BEAT_MIN = 0.125; // 1/8 beat = 1/32 note
  const BEAT_MAX = 2;     // 1/2 note
  // note values in beats (4/4): 1/32, 1/16, 1/8, 1/8d, 1/4, 1/2
  const NOTE_BEATS = [0.125, 0.25, 0.5, 0.75, 1, 2];
  const NOTE_NAMES = { 0.125: '1/32', 0.25: '1/16', 0.5: '1/8', 0.75: '1/8d', 1: '1/4', 2: '1/2' };
  const SNAP_NOTES = [0.25, 0.5, 0.75, 1]; // 1/16, 1/8, 1/8d, 1/4 (plus range ends in NOTE_BEATS)

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dbToGain = db => {
    if (!isFinite(db) || db <= -60) return 0;
    return Math.pow(10, db / 20);
  };
  const gainToDb = g => {
    if (!isFinite(g) || g <= 0) return -Infinity;
    return 20 * Math.log10(g);
  };
  const nowOf = ctx => (ctx && typeof ctx.currentTime === 'number') ? ctx.currentTime : 0;
  function smooth(param, value, ctx) {
    if (!param) return;
    const t = nowOf(ctx);
    // hold the computed value, drop queued ramps, then approach the new target
    if (typeof param.cancelAndHoldAtTime === 'function') {
      try { param.cancelAndHoldAtTime(t); } catch (e) {}
    } else {
      try { param.cancelScheduledValues(t); param.setValueAtTime(param.value, t); } catch (e) {}
    }
    param.setTargetAtTime(value, t, SMOOTH);
  }
  const clampEq = v => clamp(isFinite(+v) ? +v : 0, EQ_MIN, EQ_MAX);
  const clampDrive = v => clamp(isFinite(+v) ? +v : 0, DRIVE_MIN, DRIVE_MAX);
  const clampOut = v => clamp(isFinite(+v) ? +v : 0, OUT_MIN, OUT_MAX);
  const clampFb = v => clamp(isFinite(+v) ? +v : 0, FB_MIN, FB_MAX);
  const clampSend = v => clamp(isFinite(+v) ? +v : 0, SEND_MIN, SEND_MAX);

  function snapDelayBeats(v, sync) {
    const x = clamp(isFinite(+v) ? +v : 0.5, BEAT_MIN, BEAT_MAX);
    if (sync === false) return x;
    let best = NOTE_BEATS[0], bd = Infinity;
    for (let i = 0; i < NOTE_BEATS.length; i++) {
      const d = Math.abs(NOTE_BEATS[i] - x);
      if (d < bd) { bd = d; best = NOTE_BEATS[i]; }
    }
    return best;
  }
  function delaySeconds(beats, bpm) {
    const b = clamp(isFinite(+beats) ? +beats : 0, 0, BEAT_MAX);
    const p = isFinite(+bpm) && +bpm > 0 ? +bpm : 120;
    return clamp(b * (60 / p), 0, DELAY_MAX_S);
  }
  function beatsToBars(beats) { return (isFinite(+beats) ? +beats : 0) / 4; }
  function barsToBeats(bars) { return (isFinite(+bars) ? +bars : 0) * 4; }
  function formatDelayBeats(beats) {
    const s = snapDelayBeats(beats, true);
    if (Math.abs(s - (isFinite(+beats) ? +beats : 0)) < 1e-6 && NOTE_NAMES[s]) return NOTE_NAMES[s];
    const x = isFinite(+beats) ? +beats : 0;
    if (NOTE_NAMES[x]) return NOTE_NAMES[x];
    return x.toFixed(2) + ' bt';
  }
  function formatDb(db) {
    if (!isFinite(db)) return '-inf';
    const s = db.toFixed(1);
    return (db > 0 ? '+' : '') + s;
  }

  /* ---------- saturator curve ---------- */
  // k from drive dB: 0 → 0 (linear), 24 dB → ~14.85
  function driveToK(driveDb) {
    const d = clampDrive(driveDb);
    if (d <= 0) return 0;
    return Math.pow(10, d / 20) - 1;
  }
  function makeCurve(k, kind, n) {
    const N = n || 8192;
    const curve = new Float32Array(N);
    const hard = kind === 'hard' || kind === 'clip';
    if (k < 1e-8) {
      for (let i = 0; i < N; i++) curve[i] = (i / (N - 1)) * 2 - 1;
      return curve;
    }
    if (hard) {
      const g = 1 + k;
      for (let i = 0; i < N; i++) {
        const x = (i / (N - 1)) * 2 - 1;
        const y = x * g;
        curve[i] = y > 1 ? 1 : y < -1 ? -1 : y;
      }
      return curve;
    }
    for (let i = 0; i < N; i++) {
      const x = (i / (N - 1)) * 2 - 1;
      curve[i] = Math.tanh(k * x);
    }
    return curve;
  }
  function compGain(k, kind) {
    if (kind === 'hard' || kind === 'clip') return 1;
    if (k < 1e-8) return 1;
    return 1 / Math.tanh(k);
  }

  /* ---------- node factories ---------- */
  function createEq(ctx) {
    const lo = ctx.createBiquadFilter();
    lo.type = 'lowshelf';
    lo.frequency.value = EQ_LO_HZ;
    lo.gain.value = 0;
    const mid = ctx.createBiquadFilter();
    mid.type = 'peaking';
    mid.frequency.value = EQ_MID_HZ;
    mid.Q.value = EQ_MID_Q;
    mid.gain.value = 0;
    const hi = ctx.createBiquadFilter();
    hi.type = 'highshelf';
    hi.frequency.value = EQ_HI_HZ;
    hi.gain.value = 0;
    lo.connect(mid);
    mid.connect(hi);
    return { input: lo, output: hi, lo, mid, hi };
  }

  function createSaturator(ctx) {
    const input = ctx.createGain();
    input.gain.value = 1;
    const shaper = ctx.createWaveShaper();
    shaper.oversample = '2x';
    shaper.curve = makeCurve(0, 'soft');
    const comp = ctx.createGain();
    comp.gain.value = 1;
    const outGain = ctx.createGain();
    outGain.gain.value = 1;
    input.connect(shaper);
    shaper.connect(comp);
    comp.connect(outGain);
    return { input, shaper, comp, outGain, output: outGain };
  }

  function createDelay(ctx) {
    const send = ctx.createGain();
    send.gain.value = 0;
    const delay = ctx.createDelay(DELAY_MAX_S);
    delay.delayTime.value = 0.5;
    const lpf = ctx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.value = 4000;
    lpf.Q.value = 0.7;
    const feedback = ctx.createGain();
    feedback.gain.value = 0;
    const output = ctx.createGain();
    output.gain.value = 1;
    send.connect(delay);
    delay.connect(lpf);
    lpf.connect(output);
    lpf.connect(feedback);
    feedback.connect(delay);
    return { send, delay, lpf, feedback, output, input: send };
  }

  function defaults(opts) {
    const o = opts || {};
    const sync = o.sync !== false;
    return {
      lo: clampEq(o.lo == null ? 0 : o.lo),
      mid: clampEq(o.mid == null ? 0 : o.mid),
      hi: clampEq(o.hi == null ? 0 : o.hi),
      drive: clampDrive(o.drive == null ? 0 : o.drive),
      out: clampOut(o.out == null ? 0 : o.out),
      curve: o.curve === 'hard' || o.curve === 'clip' ? 'hard' : 'soft',
      delayBeats: snapDelayBeats(o.delayBeats == null ? (o.beats == null ? 0.5 : o.beats) : o.delayBeats, sync),
      feedback: clampFb(o.feedback == null ? 0 : o.feedback),
      send: clampSend(o.send == null ? 0 : o.send),
      sync: sync
    };
  }

  function applyEq(nodes, state, ctx) {
    smooth(nodes.lo.gain, state.lo, ctx);
    smooth(nodes.mid.gain, state.mid, ctx);
    smooth(nodes.hi.gain, state.hi, ctx);
    if (nodes.mid.Q) smooth(nodes.mid.Q, EQ_MID_Q, ctx);
  }

  function applySat(nodes, state, ctx) {
    const k = driveToK(state.drive);
    const kind = state.curve === 'hard' ? 'hard' : 'soft';
    nodes.shaper.oversample = '2x';
    nodes.shaper.curve = makeCurve(k, kind);
    smooth(nodes.comp.gain, compGain(k, kind), ctx);
    smooth(nodes.outGain.gain, dbToGain(state.out), ctx);
  }

  // applySat but snap AudioParams now (offline renders / tests)
  function applySatImmediate(nodes, state, ctx) {
    const k = driveToK(state.drive);
    const kind = state.curve === 'hard' ? 'hard' : 'soft';
    nodes.shaper.oversample = '2x';
    nodes.shaper.curve = makeCurve(k, kind);
    const c = compGain(k, kind);
    const o = dbToGain(state.out);
    nodes.comp.gain.value = c;
    nodes.outGain.gain.value = o;
    if (ctx) {
      const t = nowOf(ctx);
      nodes.comp.gain.setTargetAtTime(c, t, SMOOTH);
      nodes.outGain.gain.setTargetAtTime(o, t, SMOOTH);
    }
  }

  function applyDelay(nodes, state, ctx, bpm) {
    smooth(nodes.send.gain, state.send, ctx);
    smooth(nodes.feedback.gain, state.feedback, ctx);
    smooth(nodes.delay.delayTime, delaySeconds(state.delayBeats, bpm), ctx);
  }

  function applyDelayImmediate(nodes, state, ctx, bpm) {
    nodes.send.gain.value = state.send;
    nodes.feedback.gain.value = state.feedback;
    const sec = delaySeconds(state.delayBeats, bpm);
    nodes.delay.delayTime.value = sec;
    if (ctx) applyDelay(nodes, state, ctx, bpm);
  }

  /* ---------- insert into a batch-1-shaped chain ----------
     chain: input → [eq] → filter → [sat] → utilGain → panner → output
     delay send taps panner (default) or output, return goes to delayReturn (master)
  */
  function install(chain, pieces) {
    if (!chain) throw new Error('OrbsFX2.install requires a batch-1-shaped chain');
    const p = pieces || {};
    if (p.eq) {
      try { chain.input.disconnect(chain.filter); } catch (e) {
        try { chain.input.disconnect(); } catch (e2) {}
      }
      chain.input.connect(p.eq.input);
      p.eq.output.connect(chain.filter);
      chain.eq = p.eq;
    }
    if (p.sat) {
      try { chain.filter.disconnect(chain.utilGain); } catch (e) {
        try { chain.filter.disconnect(); } catch (e2) {}
      }
      chain.filter.connect(p.sat.input);
      p.sat.output.connect(chain.utilGain);
      chain.sat = p.sat;
    }
    if (p.delay) {
      const src = p.delayFrom === 'output' ? chain.output : (chain.panner || chain.output);
      src.connect(p.delay.send);
      if (p.delayReturn) p.delay.output.connect(p.delayReturn);
      chain.delay = p.delay;
    }
    return chain;
  }

  function snapshot(state) {
    return {
      lo: state.lo, mid: state.mid, hi: state.hi,
      drive: state.drive, out: state.out, curve: state.curve,
      delayBeats: state.delayBeats, beats: state.delayBeats,
      feedback: state.feedback, send: state.send, sync: state.sync
    };
  }

  /* ---------- engine ---------- */
  function create(ctx, opts) {
    if (!ctx || typeof ctx.createGain !== 'function') throw new Error('OrbsFX2.create requires an AudioContext');
    const options = opts || {};
    let bpm = isFinite(+options.bpm) ? +options.bpm : 120;
    const bpmOf = typeof options.bpm === 'function' ? options.bpm : () => bpm;
    const delayReturn = options.destination || options.delayReturn || null;
    const delayFrom = options.delayFrom || 'panner';
    const orbits = Object.create(null);

    function need(id) {
      const o = orbits[id];
      if (!o) throw new Error('OrbsFX2: unknown orbit "' + id + '"');
      return o;
    }
    function currentBpm() {
      const v = +bpmOf();
      return isFinite(v) && v > 0 ? v : bpm;
    }

    function addOrbit(id, chain, init) {
      if (orbits[id]) removeOrbit(id);
      const state = defaults(init);
      const eq = createEq(ctx);
      const sat = createSaturator(ctx);
      const delay = createDelay(ctx);
      let own = false;
      let ch = chain;
      if (!ch) {
        own = true;
        const input = ctx.createGain();
        const output = ctx.createGain();
        input.connect(eq.input);
        eq.output.connect(sat.input);
        sat.output.connect(output);
        if (delayReturn || options.autoConnect !== false) {
          output.connect(delayReturn || ctx.destination);
        }
        output.connect(delay.send);
        if (delayReturn) delay.output.connect(delayReturn);
        else if (options.autoConnect !== false) delay.output.connect(ctx.destination);
        ch = { input, output, eq, sat, delay, panner: output, filter: null, utilGain: null, _standalone: true };
      } else {
        install(ch, { eq, sat, delay, delayFrom, delayReturn: delayReturn || (ch.output && options.autoConnect !== false ? null : null) });
        if (delayReturn) {
          // already connected in install
        } else if (options.autoConnect !== false && !delayReturn) {
          // if host didn't pass a return, leave delay.output unconnected so they can wire it
        }
      }
      applyEq(eq, state, ctx);
      applySat(sat, state, ctx);
      applyDelay(delay, state, ctx, currentBpm());
      orbits[id] = { id, state, eq, sat, delay, chain: ch, own };
      return snapshot(state);
    }

    function removeOrbit(id) {
      const o = orbits[id];
      if (!o) return false;
      try { o.eq.input.disconnect(); } catch (e) {}
      try { o.sat.input.disconnect(); } catch (e) {}
      try { o.delay.send.disconnect(); } catch (e) {}
      try { o.delay.output.disconnect(); } catch (e) {}
      delete orbits[id];
      return true;
    }

    function getOrbit(id) { return snapshot(need(id).state); }
    function nodes(id) {
      const o = need(id);
      return { eq: o.eq, sat: o.sat, delay: o.delay, chain: o.chain };
    }
    function ids() { return Object.keys(orbits); }

    function setEq(id, params) {
      const o = need(id);
      const p = params || {};
      if (p.lo != null) o.state.lo = clampEq(p.lo);
      if (p.mid != null) o.state.mid = clampEq(p.mid);
      if (p.hi != null) o.state.hi = clampEq(p.hi);
      if (p.low != null) o.state.lo = clampEq(p.low);
      if (p.high != null) o.state.hi = clampEq(p.high);
      applyEq(o.eq, o.state, ctx);
      return snapshot(o.state);
    }
    function setSat(id, params) {
      const o = need(id);
      const p = params || {};
      if (p.drive != null) o.state.drive = clampDrive(p.drive);
      if (p.out != null) o.state.out = clampOut(p.out);
      if (p.output != null) o.state.out = clampOut(p.output);
      if (p.curve != null) o.state.curve = (p.curve === 'hard' || p.curve === 'clip') ? 'hard' : 'soft';
      applySat(o.sat, o.state, ctx);
      return snapshot(o.state);
    }
    function setDelay(id, params) {
      const o = need(id);
      const p = params || {};
      if (p.sync != null) o.state.sync = !!p.sync;
      if (p.beats != null || p.delayBeats != null || p.time != null) {
        o.state.delayBeats = snapDelayBeats(p.beats != null ? p.beats : (p.delayBeats != null ? p.delayBeats : p.time), o.state.sync);
      }
      if (p.ms != null && p.beats == null && p.delayBeats == null && p.time == null) {
        const beats = (+p.ms / 1000) * (currentBpm() / 60);
        o.state.delayBeats = snapDelayBeats(beats, o.state.sync);
      }
      if (p.feedback != null || p.fb != null) o.state.feedback = clampFb(p.feedback != null ? p.feedback : p.fb);
      if (p.send != null) o.state.send = clampSend(p.send);
      applyDelay(o.delay, o.state, ctx, currentBpm());
      return snapshot(o.state);
    }
    function setBpm(v) {
      if (typeof options.bpm !== 'function') bpm = +v || bpm;
      const p = currentBpm();
      for (const id in orbits) applyDelay(orbits[id].delay, orbits[id].state, ctx, p);
      return p;
    }
    function attach(fx1, dest) {
      const ret = dest || delayReturn || (fx1 && fx1.master);
      if (fx1 && typeof fx1.ids === 'function') {
        const list = fx1.ids();
        for (let i = 0; i < list.length; i++) {
          const id = list[i];
          if (!orbits[id] && typeof fx1.chain === 'function') {
            const prevRet = arguments.length > 1 ? dest : ret;
            // temporarily wire this orbit's delay to ret via addOrbit install
            addOrbit(id, fx1.chain(id), {});
            if (prevRet && orbits[id]) {
              try { orbits[id].delay.output.connect(prevRet); } catch (e) {}
            }
          }
        }
      }
      return ids();
    }
    function dispose() {
      for (const id of Object.keys(orbits)) removeOrbit(id);
    }

    return {
      context: ctx,
      addOrbit, removeOrbit, getOrbit, nodes, ids,
      setEq, setSat, setDelay, setBpm, getBpm: currentBpm,
      attach, dispose
    };
  }

  /* ---------- visuals ---------- */
  function gainAlpha(gainDb, highlight) {
    if (highlight) return 0.9;
    const db = isFinite(gainDb) ? gainDb : -24;
    if (db <= 0) return 0.15 + 0.13 * clamp((db + 24) / 24, 0, 1);
    return 0.28 + 0.42 * clamp(db / 6, 0, 1);
  }
  function angDiff(a, b) {
    let d = Math.abs(a - b) % (Math.PI * 2);
    if (d > Math.PI) d = Math.PI * 2 - d;
    return d;
  }
  function eqOffset(theta, lo, mid, hi, px) {
    const w = 0.55;
    const bump = c => Math.exp(-0.5 * Math.pow(angDiff(theta, c) / w, 2));
    const s = (px == null ? 8 : px) / 15;
    return s * (hi * bump(0) + mid * (bump(Math.PI / 2) + bump(-Math.PI / 2)) + lo * bump(Math.PI));
  }
  function bandFromAngle(ang) {
    const dHigh = angDiff(ang, 0);
    const dMid = Math.min(angDiff(ang, Math.PI / 2), angDiff(ang, -Math.PI / 2));
    const dLow = angDiff(ang, Math.PI);
    if (dHigh <= dMid && dHigh <= dLow) return 'hi';
    if (dLow <= dMid) return 'lo';
    return 'mid';
  }
  function hash01(i, seed) {
    const x = Math.sin(i * 127.1 + (seed || 1) * 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function drawOrbit(ctx2d, opts) {
    const o = opts || {};
    const x = o.x, y = o.y, r = o.r;
    const lo = o.lo || 0, mid = o.mid || 0, hi = o.hi || 0;
    const drive = o.drive || 0;
    const muted = !!o.muted;
    const highlight = !!o.highlight;
    const alpha = gainAlpha(o.gainDb, highlight);
    const jitterAmp = (drive / DRIVE_MAX) * 3;
    const seed = o.seed == null ? 1 : o.seed;
    const type = o.filterType || 'bypass';
    const q = o.q == null ? 0.7 : o.q;
    const amount = o.filterAmount || 0;
    const active = type !== 'bypass' && Math.abs(amount) > 0.04;
    const wobble = active ? ((q - 0.5) / 11.5) * 2.6 : 0;
    const steps = 192;

    ctx2d.save();
    ctx2d.lineWidth = 1;
    ctx2d.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
    if (muted) ctx2d.setLineDash([3, 4]);
    ctx2d.beginPath();
    for (let i = 0; i <= steps; i++) {
      const t = (i / steps) * Math.PI * 2;
      const nEq = eqOffset(t, lo, mid, hi, 8);
      const nSat = jitterAmp ? jitterAmp * (
        Math.sin(t * 29 + seed * 1.7) * 0.5 +
        Math.sin(t * 47 + seed * 2.3) * 0.3 +
        Math.sin(t * 73 + seed * 0.9) * 0.15 +
        (hash01(i, seed) * 2 - 1) * 0.2
      ) : 0;
      const nW = wobble ? (Math.sin(t * 11) * wobble + Math.sin(t * 17) * wobble * 0.35) : 0;
      const rr = r + nEq + nSat + nW;
      const px = x + Math.sin(t) * rr;
      const py = y - Math.cos(t) * rr;
      if (i === 0) ctx2d.moveTo(px, py); else ctx2d.lineTo(px, py);
    }
    ctx2d.stroke();
    ctx2d.setLineDash([]);

    const lap = o.lapBeats != null ? o.lapBeats : (o.lap == null ? 4 : o.lap * 4);
    const beats = Math.max(1, Math.round(lap));
    const tickA = highlight ? 0.55 : Math.max(0.14, alpha * 0.7);
    ctx2d.strokeStyle = 'rgba(255,255,255,' + tickA + ')';
    for (let i = 0; i < beats; i++) {
      const t = (i / beats) * Math.PI * 2;
      const c = Math.cos(t), s = Math.sin(t);
      const inner = r - (i === 0 ? 5 : 3);
      const outer = r + (i === 0 ? 5 : 3);
      ctx2d.beginPath();
      ctx2d.moveTo(x + s * inner, y - c * inner);
      ctx2d.lineTo(x + s * outer, y - c * outer);
      ctx2d.stroke();
    }

    if (active) {
      const inward = type === 'lowpass';
      const strength = clamp(Math.abs(amount), 0, 1);
      const nTicks = 24;
      const len = 2 + strength * 7;
      ctx2d.strokeStyle = 'rgba(255,255,255,' + (0.16 + strength * 0.45) + ')';
      for (let i = 0; i < nTicks; i++) {
        const t = ((i + 0.5) / nTicks) * Math.PI * 2;
        const c = Math.cos(t), s = Math.sin(t);
        const a = inward ? r - 1 : r + 1;
        const b = inward ? r - 1 - len : r + 1 + len;
        ctx2d.beginPath();
        ctx2d.moveTo(x + s * a, y - c * a);
        ctx2d.lineTo(x + s * b, y - c * b);
        ctx2d.stroke();
      }
    }

    if (o.phase === 180) {
      ctx2d.fillStyle = 'rgba(255,255,255,' + Math.max(0.45, alpha) + ')';
      ctx2d.font = '9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
      ctx2d.textAlign = 'center';
      ctx2d.textBaseline = 'bottom';
      ctx2d.fillText('ø', x, y - r - 7);
    }
    if (o.label) {
      ctx2d.fillStyle = 'rgba(255,255,255,' + (highlight ? 0.7 : 0.35) + ')';
      ctx2d.font = '10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
      ctx2d.textAlign = 'left';
      ctx2d.textBaseline = 'middle';
      ctx2d.fillText(o.label, x + 8, y - r);
    }
    ctx2d.restore();
  }

  function ghostPhases(phase, delayBeats, lapBeats, n) {
    const N = n == null ? 6 : n;
    const out = [];
    if (!(lapBeats > 0) || !(delayBeats > 0)) return out;
    const d = delayBeats / lapBeats;
    for (let i = 1; i <= N; i++) out.push((((phase - d * i) % 1) + 1) % 1);
    return out;
  }

  function drawGhosts(ctx2d, opts) {
    const o = opts || {};
    if (!(o.send > 0) || !(o.delayBeats > 0) || !(o.r > 0)) return 0;
    const phases = ghostPhases(o.phase || 0, o.delayBeats, o.lapBeats || 4, 6);
    const fb = clamp(o.feedback == null ? 0 : o.feedback, 0, 1);
    const pan = clamp(o.pan || 0, -1, 1) * 4;
    let drawn = 0;
    ctx2d.save();
    ctx2d.lineWidth = 1;

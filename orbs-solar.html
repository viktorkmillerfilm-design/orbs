<script>
/* ===== orbs fx batch 1 (inlined from fx/batch1.js) ===== */
/* orbs fx batch 1: utility, clip clock, filter
   plain umd, no deps. exposes OrbsFX (and module.exports).
   smoothing: setTargetAtTime(v, now, 0.02)
*/
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root && typeof root === 'object') root.OrbsFX = api;
}(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const SMOOTH = 0.02;
  const TICK_MS = 25;
  const HORIZON = 0.1;
  const LAP_STEPS = [0.25, 0.5, 1, 2, 3, 4, 8];
  const CUT_MIN = 20;
  const CUT_MAX = 20000;
  const Q_MIN = 0.5;
  const Q_MAX = 12;
  const BPM_MIN = 40;
  const BPM_MAX = 220;
  const GAIN_MIN = -60;
  const GAIN_MAX = 6;
  const DEAD = 0.04;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dbToGain = db => {
    if (!isFinite(db) || db <= GAIN_MIN) return 0;
    return Math.pow(10, db / 20);
  };
  const gainToDb = g => {
    if (!isFinite(g) || g <= 0) return -Infinity;
    return 20 * Math.log10(g);
  };
  const clampGainDb = v => {
    if (v === '-inf' || v === -Infinity || (typeof v === 'number' && v <= GAIN_MIN)) return -Infinity;
    const n = +v;
    if (!isFinite(n)) return 0;
    return clamp(n, GAIN_MIN, GAIN_MAX);
  };
  const snapLap = v => {
    const x = +v;
    let best = LAP_STEPS[0], bd = Infinity;
    for (let i = 0; i < LAP_STEPS.length; i++) {
      const d = Math.abs(LAP_STEPS[i] - x);
      if (d < bd) { bd = d; best = LAP_STEPS[i]; }
    }
    return best;
  };
  const snapOffset = (v, quantize) => {
    const x = clamp(+v || 0, 0, 1);
    if (quantize === false) return x;
    return Math.round(x * 16) / 16;
  };
  const expScale = (a, b, t) => a * Math.pow(b / a, clamp(t, 0, 1));
  const logNorm = (hz, a, b) => {
    const h = clamp(hz, a, b);
    return Math.log(h / a) / Math.log(b / a);
  };
  const nowOf = ctx => (ctx && typeof ctx.currentTime === 'number') ? ctx.currentTime : 0;

  function smooth(param, value, ctx) {
    if (!param) return;
    const t = nowOf(ctx);
    param.setTargetAtTime(value, t, SMOOTH);
  }

  function defaults(opts) {
    const o = opts || {};
    const qz = o.quantize !== false;
    return {
      lap: snapLap(o.lap == null ? 1 : o.lap),
      offset: snapOffset(o.offset == null ? 0 : o.offset, qz),
      quantize: qz,
      gainDb: o.gainDb == null ? 0 : clampGainDb(o.gainDb),
      pan: clamp(o.pan == null ? 0 : +o.pan, -1, 1),
      muted: !!o.muted,
      phase: o.phase === 180 || o.phase === '180' ? 180 : 0,
      mono: !!o.mono,
      filterType: o.filterType === 'lowpass' || o.filterType === 'highpass' || o.filterType === 'bypass' ? o.filterType : 'bypass',
      cutoff: clamp(o.cutoff == null ? CUT_MAX : +o.cutoff, CUT_MIN, CUT_MAX),
      q: clamp(o.q == null ? 0.7 : +o.q, Q_MIN, Q_MAX)
    };
  }

  function filterAmountOf(type, cutoff) {
    if (!type || type === 'bypass') return 0;
    const t = logNorm(cutoff, CUT_MIN, CUT_MAX);
    if (type === 'lowpass') return -(1 - t);
    return t;
  }

  function amountToFilter(amount) {
    const a = clamp(amount, -1, 1);
    if (Math.abs(a) < DEAD) return { type: 'bypass', cutoff: CUT_MAX };
    if (a < 0) {
      const t = (Math.abs(a) - DEAD) / (1 - DEAD);
      return { type: 'lowpass', cutoff: expScale(CUT_MAX, CUT_MIN, t) };
    }
    const t = (a - DEAD) / (1 - DEAD);
    return { type: 'highpass', cutoff: expScale(CUT_MIN, CUT_MAX, t) };
  }

  /* ---------- per-orbit audio chain ---------- */
  // input -> filter -> utilGain (gain + phase) -> panner -> (stereo | mono sum) -> output
  function createChain(ctx) {
    const input = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = CUT_MAX;
    filter.Q.value = 0.7;
    const utilGain = ctx.createGain();
    utilGain.gain.value = 1;
    const panner = ctx.createStereoPanner();
    panner.pan.value = 0;

    const stereoGain = ctx.createGain();
    stereoGain.gain.value = 1;
    const splitter = ctx.createChannelSplitter(2);
    const sum = ctx.createGain();
    sum.gain.value = 0.5;
    const merger = ctx.createChannelMerger(2);
    const monoGain = ctx.createGain();
    monoGain.gain.value = 0;
    const output = ctx.createGain();
    output.gain.value = 1;

    input.connect(filter);
    filter.connect(utilGain);
    utilGain.connect(panner);
    panner.connect(stereoGain);
    stereoGain.connect(output);
    panner.connect(splitter);
    splitter.connect(sum, 0);
    splitter.connect(sum, 1);
    sum.connect(merger, 0, 0);
    sum.connect(merger, 0, 1);
    merger.connect(monoGain);
    monoGain.connect(output);

    return { input, filter, utilGain, panner, stereoGain, splitter, sum, merger, monoGain, output };
  }

  function applyUtility(chain, state, ctx) {
    const g = state.muted ? 0 : dbToGain(state.gainDb);
    const signed = state.phase === 180 ? -g : g;
    smooth(chain.utilGain.gain, signed, ctx);
    smooth(chain.panner.pan, state.pan, ctx);
    smooth(chain.stereoGain.gain, state.mono ? 0 : 1, ctx);
    smooth(chain.monoGain.gain, state.mono ? 1 : 0, ctx);
  }

  function applyFilter(chain, state, ctx) {
    if (state.filterType === 'highpass') {
      chain.filter.type = 'highpass';
      smooth(chain.filter.frequency, state.cutoff, ctx);
      smooth(chain.filter.Q, state.q, ctx);
    } else if (state.filterType === 'lowpass') {
      chain.filter.type = 'lowpass';
      smooth(chain.filter.frequency, state.cutoff, ctx);
      smooth(chain.filter.Q, state.q, ctx);
    } else {
      // neutral bypass: lowpass at 20 kHz
      chain.filter.type = 'lowpass';
      smooth(chain.filter.frequency, CUT_MAX, ctx);
      smooth(chain.filter.Q, state.q, ctx);
    }
  }

  function snapshot(state) {
    return {
      lap: state.lap,
      offset: state.offset,
      quantize: state.quantize,
      gainDb: state.gainDb,
      pan: state.pan,
      muted: state.muted,
      phase: state.phase,
      mono: state.mono,
      filterType: state.filterType,
      cutoff: state.cutoff,
      q: state.q,
      filterAmount: filterAmountOf(state.filterType, state.cutoff)
    };
  }

  /* ---------- engine ---------- */
  function create(ctx, opts) {
    if (!ctx || typeof ctx.createGain !== 'function') throw new Error('OrbsFX.create requires an AudioContext');
    const options = opts || {};
    const master = ctx.createGain();
    master.gain.value = dbToGain(options.masterDb == null ? 0 : clampGainDb(options.masterDb));
    if (options.destination !== null && options.destination !== false) {
      master.connect(options.destination || ctx.destination);
    }

    const orbits = Object.create(null);
    let onTrigger = typeof options.onTrigger === 'function' ? options.onTrigger : null;
    let bpm = clamp(options.bpm == null ? 120 : +options.bpm, BPM_MIN, BPM_MAX);
    let swing = clamp(options.swing == null ? 0 : +options.swing, 0, 60);
    let masterDb = options.masterDb == null ? 0 : clampGainDb(options.masterDb);
    let running = false;
    let timer = null;
    let t0 = 0;
    let beat0 = 0;
    const lastBeat = Object.create(null);

    function beatsAt(time) {
      const t = time == null ? ctx.currentTime : time;
      if (!t0 && !running) return beat0;
      return beat0 + (t - t0) * (bpm / 60);
    }
    function timeAt(beats) {
      return t0 + (beats - beat0) * (60 / bpm);
    }
    function applySwing(time, beats) {
      if (swing <= 0) return time;
      const sixteenths = beats * 4;
      const rounded = Math.round(sixteenths);
      if (Math.abs(sixteenths - rounded) < 1e-8 && (rounded & 1)) {
        return time + (swing / 100) * (60 / bpm) * 0.25;
      }
      return time;
    }
    function need(id) {
      const o = orbits[id];
      if (!o) throw new Error('OrbsFX: unknown orbit "' + id + '"');
      return o;
    }
